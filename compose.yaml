services:
  setup:
    build:
      context: .
      dockerfile: ./Dockerfile.setup
      args:
        VITE_PUBLIC_BLOG_URL: ${VITE_PUBLIC_BLOG_URL}
        VITE_ADMIN_BLOG_URL: ${VITE_ADMIN_BLOG_URL}
        HOST: ${HOST}
        PORT: ${PORT}
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://username:password@postgres:5432/blogs_db
    volumes:
      - build-output:/app
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: node:20-slim
    working_dir: /app
    command: sh -c "apt-get update -y && apt-get install -y openssl && node apps/api/dist/main.js"
    env_file:
      - .env
    environment:
      NX_WORKSPACE_ROOT: /app
      PRISMA_QUERY_ENGINE_LIBRARY: /app/.prisma/client/libquery_engine-debian-openssl-3.0.x.so.node
      DATABASE_URL: postgresql://username:password@postgres:5432/blogs_db
      PORT: 3000
    ports:
      - 3000:3000
    volumes:
      - build-output:/app
    depends_on:
      setup:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  public-blog:
    image: node:20-slim
    working_dir: /app
    command: npx serve -s apps/public-blog/dist -l 4200
    volumes:
      - build-output:/app
    ports:
      - 4200:4200
    env_file:
      - .env
    environment:
      NX_WORKSPACE_ROOT: /app
      PRISMA_QUERY_ENGINE_LIBRARY: /app/.prisma/client/libquery_engine-debian-openssl-3.0.x.so.node
      DATABASE_URL: postgresql://username:password@postgres:5432/blogs_db
      PORT: 4200
    depends_on:
      setup:
        condition: service_completed_successfully
      api:
        condition: service_started
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: username
      POSTGRES_PASSWORD: password
      POSTGRES_DB: blogs_db
    ports:
      - 6543:5432
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  build-output:
